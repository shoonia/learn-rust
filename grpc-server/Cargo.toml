[package]
name = "grpc-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.11"
tonic-web = "0.11"
tower-http = { version = "0.4", features = ["cors"] }
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3.0"
