<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>WebAssembly</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>

<body>

  <div>
    <div>
      <strong>Square</strong>
      <input type="number" id="input-squarer" autofocus>
      <output id="out-squarer">0</output>
    </div>
    <div>
      <strong>Sum</strong>
      <input type="search" id="input-sum" autofocus>
      <output id="out-sum">0</output>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    const init = async () => {
      const { instance } = await WebAssembly.instantiateStreaming(
        fetch('target/wasm32-unknown-unknown/release/wasm.wasm'),
        {}
      );
      return instance.exports;
    }

    init().then((exports) => {
      const outSquarer = $('out-squarer');
      const outSum = $('out-sum');

      $('input-squarer').addEventListener('input', (event) => {
        outSquarer.textContent = exports.squarer(event.target.valueAsNumber);
      });

      $('input-sum').addEventListener('input', (event) => {
        const value = event.target.value
          .trim()
          .split(' ')
          .map(Number);

        const len = value.length;
        const ptr = 0;

        new Float64Array(exports.memory.buffer, ptr, len).set(value);

        outSum.textContent = exports.sum(ptr, len);
      });
    });

  </script>
</body>

</html>
