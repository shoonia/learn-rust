<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>WebAssembly</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>

<body>

  <div>
    <div>
      <strong>Square</strong>
      <input type="number" id="input-squarer" autofocus>
      <output id="out-squarer">0</output>
    </div>
    <div>
      <strong>Sum</strong>
      <input type="text" id="input-sum" autofocus>
      <output id="out-sum">0</output>
    </div>
    <div>
      <strong>Uppercase</strong>
      <input type="text" id="input-uppercase" autofocus>
      <output id="out-uppercase"></output>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    const source = await WebAssembly.instantiateStreaming(
      fetch('target/wasm32-unknown-unknown/release/wasm.wasm'),
    );

    const { exports } = source.instance;

    // Number squarer

    $('input-squarer').addEventListener('input', (event) => {
      $('out-squarer').textContent = exports.squarer(event.target.valueAsNumber);
    });

    // Array sum

    $('input-sum').addEventListener('input', (event) => {
      const value = event.target.value
        .trim()
        .split(' ')
        .map(Number);

      const len = value.length;
      const ptr = 0;

      new Float64Array(exports.memory.buffer, ptr, len).set(value);

      $('out-sum').textContent = exports.sum(ptr, len);
    });

    // to Uppercase string

    const sendString = (str) => {
      const bytes = new TextEncoder().encode(str);
      const ptr = exports.alloc(bytes.length);
      new Uint8Array(exports.memory.buffer, ptr, bytes.length).set(bytes);
      return [ptr, bytes.length];
    }

    const readString = (ptr, outLenPtr) => {
      const resultLen = new DataView(exports.memory.buffer).getUint32(outLenPtr, true);
      const bytes = new Uint8Array(exports.memory.buffer, ptr, resultLen);
      return [
        new TextDecoder().decode(bytes),
        resultLen
      ];
    }

    $('input-uppercase').addEventListener('input', (event) => {
      const value = event.target.value;
      const [ptr, len] = sendString(value);
      const outLenPtr = exports.alloc(8);
      const resultPtr = exports.to_uppercase(ptr, len, outLenPtr);
      const [resultStr, resultLen] = readString(resultPtr, outLenPtr);

      $('out-uppercase').textContent = resultStr;
      exports.dealloc(ptr, len);
      exports.dealloc(resultPtr, resultLen);
      exports.dealloc(outLenPtr, 8);
    });

  </script>
</body>

</html>
